<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Trang nội bộ để tạo link mời: không có link nào trỏ tới, và không cho máy tìm kiếm lập chỉ mục. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Tạo link mời</title>
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Cormorant+Garamond:wght@500&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7efe9;
        --ink: #3d2a2f;
        --muted: #8a6f74;
        --rose: #c46a7d;
        --line: rgba(196, 106, 125, 0.2);
        --surface: #fffaf7;
        --shadow: 0 24px 60px -32px rgba(120, 70, 80, 0.35), 0 4px 14px -8px rgba(120, 70, 80, 0.12);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: radial-gradient(ellipse at 50% 0%, #fff8f4 0%, var(--bg) 60%, #efdfd8 100%) fixed;
        color: var(--ink);
        font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        font-weight: 300;
        line-height: 1.6;
        padding: clamp(2rem, 6vw, 4rem) 16px 4rem;
      }
      main { max-width: 720px; margin: 0 auto; display: grid; gap: 1.5rem; }
      header { text-align: center; }
      .script { font-family: 'Great Vibes', cursive; font-size: clamp(2.4rem, 8vw, 3.2rem); color: var(--rose); line-height: 1.2; }
      h1 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(1.7rem, 5vw, 2.2rem); }
      .sub { color: var(--muted); font-size: 0.9rem; }
      .card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: clamp(1.2rem, 4vw, 2rem); display: grid; gap: 1rem; }
      label { display: grid; gap: 0.35rem; }
      label > span { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
      input, textarea {
        width: 100%;
        padding: 0.8rem 1rem;
        font: inherit;
        font-size: 16px;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        resize: vertical;
      }
      input:focus, textarea:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 4px rgba(196, 106, 125, 0.12); }
      .hint { font-size: 0.78rem; color: var(--muted); }
      .row { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: flex-end; }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 999px;
        padding: 0.75em 1.6em;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        background: var(--ink);
        color: #fff8f4;
        transition: background 0.2s, transform 0.2s;
      }
      button:hover { background: var(--rose); transform: translateY(-1px); }
      button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
      button.ghost:hover { color: var(--rose); border-color: var(--rose); }
      button.small { padding: 0.55em 1.1em; font-size: 0.66rem; }
      .results { display: grid; gap: 0.8rem; }
      .results:empty { display: none; }
      .result { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 1rem 1.1rem; display: grid; gap: 0.5rem; }
      .result-name { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 1.25rem; }
      .result-link { font-size: 0.85rem; color: var(--rose); word-break: break-all; }
      .result .row { justify-content: flex-start; }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem; }
      .toolbar p { font-size: 0.85rem; color: var(--muted); }
      #toast {
        position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
        background: var(--ink); color: #fff; padding: 0.7rem 1.2rem; border-radius: 999px; font-size: 0.85rem;
        transition: 0.3s; pointer-events: none;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="script">Thọ &amp; Trang</p>
        <h1>Tạo link mời khách</h1>
        <p class="sub">Mỗi khách một link riêng: mở ra thiệp sẽ ghi “Thân gửi” và tên khách.</p>
      </header>

      <section class="card">
        <label>
          <span>Tên khách mời</span>
          <textarea id="names" rows="5" placeholder="Anh Tuấn&#10;Chị Hương và gia đình&#10;Bạn Linh"></textarea>
        </label>
        <p class="hint">Mỗi dòng một khách. Có thể dán cả danh sách từ Excel hoặc Zalo.</p>

        <label>
          <span>Lời mời kèm link (tuỳ chọn)</span>
          <textarea id="template" rows="3"></textarea>
        </label>
        <p class="hint"><b>{ten}</b> sẽ được thay bằng tên khách, <b>{link}</b> bằng link mời.</p>

        <div class="row">
          <button id="make">Tạo link</button>
        </div>
      </section>

      <section class="card" id="output" hidden>
        <div class="toolbar">
          <p id="summary"></p>
          <div class="row">
            <button class="ghost small" id="copy-all-links">Chép tất cả link</button>
            <button class="ghost small" id="copy-all-msgs">Chép tất cả lời mời</button>
            <button class="ghost small" id="csv">Tải file CSV</button>
          </div>
        </div>
        <div class="results" id="results"></div>
      </section>
    </main>
    <div id="toast" role="status"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const DEFAULT_TEMPLATE =
        'Thân gửi {ten}, Thọ & Trang trân trọng mời bạn đến chung vui trong ngày cưới của chúng mình. Thiệp mời: {link}';

      // Ghi nhớ lời mời trên máy này cho lần sau.
      const store = {
        get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
        set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
      };
      $('template').value = store.get('invite-template') || DEFAULT_TEMPLATE;

      let items = [];

      const linkFor = (name) => {
        // Link trỏ về trang chủ của chính tên miền đang mở trang này.
        const url = new URL('/', location.origin);
        url.searchParams.set('to', name);
        return url.toString();
      };
      const messageFor = (it) => $('template').value.replaceAll('{ten}', it.name).replaceAll('{link}', it.link);

      function make() {
        const names = [...new Set($('names').value.split('\n').map((s) => s.trim().replace(/\s+/g, ' ')).filter(Boolean))];
        if (!names.length) return toast('Bạn nhập ít nhất một tên khách nhé');
        items = names.map((name) => ({ name: [...name].slice(0, 80).join(''), link: linkFor([...name].slice(0, 80).join('')) }));
        store.set('invite-template', $('template').value);
        render();
      }

      function render() {
        $('output').hidden = false;
        $('summary').textContent = `${items.length} link mời`;
        $('results').replaceChildren(
          ...items.map((it) => {
            const card = document.createElement('article');
            card.className = 'result';
            const name = document.createElement('p');
            name.className = 'result-name';
            name.textContent = it.name;
            const link = document.createElement('a');
            link.className = 'result-link';
            link.href = it.link;
            link.target = '_blank';
            link.rel = 'noopener';
            link.textContent = it.link;
            const row = document.createElement('div');
            row.className = 'row';
            row.append(
              button('Chép link', () => copy(it.link, 'Đã chép link')),
              button('Chép lời mời', () => copy(messageFor(it), 'Đã chép lời mời')),
            );
            if (navigator.share) {
              row.append(button('Chia sẻ', () => navigator.share({ title: 'Thiệp cưới', text: messageFor(it) }).catch(() => {})));
            }
            card.append(name, link, row);
            return card;
          }),
        );
        $('output').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function button(text, onClick) {
        const b = document.createElement('button');
        b.className = 'ghost small';
        b.textContent = text;
        b.addEventListener('click', onClick);
        return b;
      }

      async function copy(text, done) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          // Trình duyệt chặn clipboard (http hoặc webview): chép theo cách cũ.
          const ta = Object.assign(document.createElement('textarea'), { value: text });
          document.body.append(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        toast(done);
      }

      function downloadCsv() {
        const esc = (s) => `"${s.replace(/"/g, '""')}"`;
        const rows = ['Tên khách,Link,Lời mời', ...items.map((it) => [it.name, it.link, messageFor(it)].map(esc).join(','))];
        // BOM để Excel đọc đúng tiếng Việt.
        const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'link-moi.csv' });
        a.click();
        URL.revokeObjectURL(a.href);
      }

      let toastTimer;
      function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
      }

      $('make').addEventListener('click', make);
      $('copy-all-links').addEventListener('click', () =>
        copy(items.map((it) => `${it.name}: ${it.link}`).join('\n'), `Đã chép ${items.length} link`),
      );
      $('copy-all-msgs').addEventListener('click', () =>
        copy(items.map(messageFor).join('\n\n'), `Đã chép ${items.length} lời mời`),
      );
      $('csv').addEventListener('click', downloadCsv);
    </script>
  </body>
</html>
